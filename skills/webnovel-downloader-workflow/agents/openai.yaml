interface:
  display_name: "Webnovel Downloader"
  short_description: "Download a confirmed webnovel target through an expensive search-to-download workflow; never use search for discovery or recommendations"
  default_prompt: "Use $webnovel-downloader-workflow only for explicit webnovel download requests with a confirmed target, source management, or plugin safety review. webnovel_search_books is an expensive download-preparation step, not a general search, recommendation, discovery, availability-check, or casual lookup tool. Before calling it, require explicit current download intent and an exact title; if same-name works may be confused, require the author and ask the user before searching. Call search once for the confirmed target, then use its search_id and group_index for the current download. If one candidate group exactly matches, proceed to webnovel_download_book; if materially different works remain, ask the user to choose from the existing result without searching again. Do not pass or recommend arbitrary book_url downloads. Do not proactively poll long-running tasks."
