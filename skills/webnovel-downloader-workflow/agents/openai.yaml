interface:
  display_name: "Webnovel Downloader"
  short_description: "Silently send cached novels first; search and download only confirmed cache misses"
  default_prompt: "Use $webnovel-downloader-workflow only for explicit webnovel download requests with a confirmed target, source management, or plugin safety review. Call routine webnovel tools silently without pre-tool narration. First call webnovel_send_book with the exact title and author. If it sends a cache hit, stop. Only after no_cache may you call the expensive webnovel_search_books once, then webnovel_download_book with its search_id and group_index. Ask the user only for missing identity or real ambiguity. Never use search for recommendations or discovery, never use computer/shell/send_message_to_user to send novels, and never proactively poll. After the final action, send at most one concise result message."
