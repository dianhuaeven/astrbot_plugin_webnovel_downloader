interface:
  display_name: "Webnovel Downloader"
  short_description: "Guide AstrBot through Legado source import, grouped search, safe cached downloads, probe checks, and 1.0 safety constraints"
  default_prompt: "Use $webnovel-downloader-workflow for AstrBot webnovel downloads. The public 1.0 LLM surface is webnovel_search_books, webnovel_download_book, webnovel_download_status, webnovel_import_sources, webnovel_list_sources, webnovel_refresh_sources, webnovel_probe_status, webnovel_import_clean_rules, and webnovel_list_clean_rules. Default to webnovel_search_books first, then webnovel_download_book with search_id and group_index only. Do not pass or recommend arbitrary book_url downloads. Treat free-URL preview/download paths, untrusted QuickJS execution, unlocked JSON state, and silent exceptions as safety or maintenance risks. Bundled skill auto-install is intended behavior, but it must remain idempotent, configurable, logged, and non-blocking for core plugin startup."
